# Prefer keeping Gradle caches on D: (set GRADLE_USER_HOME=D:\\CURSOR\\gradle-home
# before building, or configure Android Studio Gradle JDK / user home).
# Example PowerShell:
#   $env:GRADLE_USER_HOME = "D:\\CURSOR\\gradle-home"
#   $env:TEMP = "D:\\CURSOR\\tmp-agent"
#   $env:TMP = "D:\\CURSOR\\tmp-agent"

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=false
android.enableBuildCache=false
android.defaults.buildfeatures.buildconfig=false
